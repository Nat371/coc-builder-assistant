
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/auto-attack-accessibility

# Keep only the newest build for this branch; prevent stale APK runs from confusing testing.
concurrency:
  group: coc-builder-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android source
        run: |
          unzip -o CoCBuilderAssistant-Android-Source.zip -d android-source

      - name: Add Accessibility Start Stop scaffold
        run: |
          python3 scripts/install_auto_attack_scaffold.py

      - name: Install Accessibility UI inspector prototype
        run: |
          python3 scripts/install_accessibility_inspector.py

      - name: Install screen capture permission test
        run: |
          python3 scripts/install_screen_capture_test.py

      - name: Fix Android 14 MediaProjection foreground service
        run: |
          python3 scripts/install_media_projection_foreground_service.py

      - name: Install OCR text recognition
        run: |
          python3 scripts/install_ocr_text_recognition_v2.py

      - name: Install troop bar visual diagnostics
        run: |
          python3 scripts/install_troop_bar_diagnostics.py

      - name: Ensure Accessibility service is registered in manifest
        run: |
          python3 scripts/ensure_accessibility_manifest.py

      - name: Locate Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Fix Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android-source/coc-builder-assistant/app")
          files = [root / "build.gradle.kts", root / "build.gradle"]
          target = next((p for p in files if p.exists()), None)
          if target is None:
              raise SystemExit("ERROR: app/build.gradle(.kts) tidak ditemukan")

          if target.suffix == ".kts":
              fix = """
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions { jvmTarget = "17" }
          }
          """
          else:
              fix = """
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions { jvmTarget = "17" }
          }
          """
          with target.open("a", encoding="utf-8") as f:
              f.write(fix)
          print("Target Java dan Kotlin disamakan ke versi 17.")
          PY

      - name: Build APK
        run: |
          cd android-source/coc-builder-assistant
          gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CoCBuilderAssistant-APK
          path: android-source/coc-builder-assistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
