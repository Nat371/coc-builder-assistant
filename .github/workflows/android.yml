
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android source
        run: |
          unzip -o CoCBuilderAssistant-Android-Source.zip -d android-source
          echo "Source files extracted"
          find android-source -maxdepth 3 -type f | head -80

      - name: Build APK
        run: |
          GRADLE_FILE=$(find android-source -name gradlew -type f | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: File gradlew tidak ditemukan dalam ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CoCBuilderAssistant-APK
          path: android-source/**/*.apk
          if-no-files-found: error
